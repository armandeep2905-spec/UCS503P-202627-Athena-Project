databases:
  - name: athena-db
    plan: free
    databaseName: athena
    user: athena

services:
  - type: web
    name: athena-api
    runtime: python
    plan: free
    rootDir: code/backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/institutions/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: athena-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
